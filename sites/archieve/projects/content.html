<div id="project-lab" class="projects-site" lang="en" role="document" tabindex="-1">
	<header class="project-lab-header">
		<h2>Caleb’s Project Lab</h2>
		<a href="#project-lab-updates">Updates <span aria-hidden="true">↗</span></a>
	</header>
	<div class="dvd-stage" data-dvd-stage aria-label="Decorative DVD screensaver">
		<div class="dvd-logo" data-dvd-logo aria-hidden="true">
			<span class="dvd-logo-layer dvd-logo-cyan"></span>
			<span class="dvd-logo-layer dvd-logo-magenta"></span>
			<span class="dvd-logo-layer dvd-logo-base dvd-logo-band-top"></span>
			<span class="dvd-logo-layer dvd-logo-base dvd-logo-band-middle"></span>
			<span class="dvd-logo-layer dvd-logo-base dvd-logo-band-disc"></span>
			<span class="dvd-logo-layer dvd-logo-base dvd-logo-band-footer"></span>
			<span class="dvd-logo-layer dvd-logo-glitch dvd-logo-lime"></span>
			<span class="dvd-logo-layer dvd-logo-glitch dvd-logo-red"></span>
			<span class="dvd-logo-layer dvd-logo-glitch dvd-logo-yellow"></span>
		</div>
		<button class="dvd-pause" type="button" data-dvd-pause aria-pressed="false" hidden>Pause animation</button>
	</div>
	<div class="project-drawer-bar" data-project-drawer-bar hidden>
		<h3>Project library</h3>
		<button class="project-drawer-toggle" type="button" data-project-toggle aria-expanded="false" aria-controls="project-workspace"><span data-project-toggle-label>Browse projects</span><span class="project-drawer-arrow" aria-hidden="true">⌃</span></button>
		<p class="project-preview" data-project-preview></p>
	</div>
	<div id="project-workspace" class="project-workspace" data-project-workspace>
		<!-- project-catalogue -->
	</div>
</div>
