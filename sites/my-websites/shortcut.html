<li class="website-entry">
  <a class="website-shortcut" href="$target" data-website-name="$name" aria-label="Open $name website">
    <img class="website-thumbnail" src="$thumbnail" width="320" height="180" alt="" />
    <div class="website-summary">
      <h3 class="website-entry-title">$name</h3>
      $description
      $topics
      <span class="website-visit">Visit website <span aria-hidden="true">→</span></span>
    </div>
  </a>
</li>
